# XcodeGen 工程描述。安装：brew install xcodegen，然后在本目录执行 `xcodegen generate`。
# 生成 QuickRight.xcodeproj，含主程序 App 与 Finder Sync 扩展两个 target。
name: QuickRight
options:
  bundleIdPrefix: com.quickright
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # 用户 Apple ID 的 Team ID（免费账号即可）。写死在此处，避免
    # xcodegen generate 重生成工程时把 Xcode 里手选的 Team 冲掉，
    # 否则 Archive 会静默退化成 ad-hoc 本地签名，Finder 扩展不被加载。
    DEVELOPMENT_TEAM: "7Y35UPV3BS"
    ENABLE_HARDENED_RUNTIME: true
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  QuickRight:
    type: application
    platform: macOS
    sources:
      - path: QuickRight
      - path: Shared
    info:
      # XcodeGen 会据此在 path 处生成 Info.plist，并设置 INFOPLIST_FILE。
      path: QuickRight/Info.plist
      properties:
        CFBundleName: QuickRight
        CFBundleDisplayName: 右键快捷
        CFBundleIdentifier: com.quickright.QuickRight
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: "public.app-category.utilities"
        NSHumanReadableCopyright: Copyright © 2026 QuickRight
    entitlements:
      path: QuickRight/QuickRight.entitlements
      properties:
        # 免费 Apple ID 无法使用 App Group，改为固定路径共享配置；
        # 关闭沙盒以便主程序与扩展直接读写 ~/Library/Application Support/QuickRight/
        com.apple.security.app-sandbox: false
    dependencies:
      - target: QuickRightFinder
  QuickRightFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickRightFinder
      - path: Shared
    info:
      path: QuickRightFinder/Info.plist
      properties:
        CFBundleName: QuickRightFinder
        CFBundleIdentifier: com.quickright.QuickRightFinder
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FinderSync"
    entitlements:
      path: QuickRightFinder/QuickRightFinder.entitlements
      properties:
        # 关闭沙盒，与主程序共享 ~/Library/Application Support/QuickRight/ 配置
        com.apple.security.app-sandbox: false
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES

# 显式定义共享 Scheme，确保命令行 xcodebuild -scheme QuickRight 可用，
# 也避免 Xcode 里因缺少 scheme 而误选扩展 target 导致“运行无反应”。
schemes:
  QuickRight:
    build:
      targets:
        QuickRight: all
        QuickRightFinder: all
    run:
      target: QuickRight
    archive:
      target: QuickRight
      revealArchiveInOrganizer: false
