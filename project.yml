# XcodeGen 工程描述。安装：brew install xcodegen，然后在本目录执行 `xcodegen generate`。
# 生成 QuickRight.xcodeproj，含主程序 App 与 Finder Sync 扩展两个 target。
name: QuickRight
options:
  bundleIdPrefix: com.quickright
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: true
    # 本地构建前请填入你的 Developer Team ID；未填时 Xcode 会提示选择。
    DEVELOPMENT_TEAM: ""
targets:
  QuickRight:
    type: application
    platform: macOS
    sources:
      - path: QuickRight
      - path: Shared
    info:
      CFBundleName: QuickRight
      CFBundleDisplayName: 右键快捷
      CFBundleIdentifier: com.quickright.QuickRight
      CFBundleVersion: 1
      CFBundleShortVersionString: 1.0.0
      LSMinimumSystemVersion: "14.0"
      NSHumanReadableCopyright: Copyright © 2026 QuickRight
    entitlements: QuickRight/QuickRight.entitlements
    dependencies:
      - target: QuickRightFinder
  QuickRightFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickRightFinder
      - path: Shared
    info:
      CFBundleName: QuickRightFinder
      CFBundleIdentifier: com.quickright.QuickRightFinder
      CFBundleVersion: 1
      CFBundleShortVersionString: 1.0.0
      NSExtension:
        NSExtensionPointIdentifier: com.apple.FinderSync
        NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FinderSync"
    entitlements: QuickRightFinder/QuickRightFinder.entitlements
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
